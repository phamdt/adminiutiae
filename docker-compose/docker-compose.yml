version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hybrid_postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hybrid_network

  redis:
    image: redis:8.2-alpine
    container_name: hybrid_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hybrid_network

  python-api:
    build:
      context: ../python-service
      target: development
    container_name: hybrid_python_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/appdb
      - REDIS_URL=redis://redis:6379/0
      - GO_SERVICE_URL=http://go-worker:8080
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../python-service:/app
    networks:
      - hybrid_network
    restart: unless-stopped

  go-worker:
    build:
      context: ../go-service
      target: production
    container_name: hybrid_go_worker
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/appdb
      - REDIS_URL=redis://redis:6379/0
      - PORT=8080
      - ENVIRONMENT=development
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hybrid_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  hybrid_network:
    driver: bridge